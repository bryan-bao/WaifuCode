<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>给她派个活</title>
<style>
  /* 左手「派活」，右手「她的状态和现场」。
     以前是一根 480px 的窄条，任务列表压在表单底下，得滚半天才看得到 ——
     现在两栏各管各的，右栏自己滚，表单永远整个在眼前。

     ── 皮肤 ────────────────────────────────────────────────────────────
     所有颜色、圆角、渐变全走 CSS 变量，皮肤 = 一组变量覆盖（body 上的
     data-theme）。加新皮肤只加一段 [data-theme=xxx]，别去正文里写死颜色 ——
     写死一处，那一处就在所有皮肤里长一个样。 */
  :root {
    /* 深空（默认）：暗夜蓝 + 青粉点缀 */
    --bg: #0d0f16;
    --card: #161a24;      /* 卡片 */
    --card2: #1c2231;     /* 稍亮一档的卡片 */
    --line: #272e3f;      /* 描边 */
    --line2: #1b2130;     /* 更淡的分隔线 */
    --fg: #e6e8f0;
    --dim: #8b93a7;       /* 次要文字 */
    --dim2: #a9b2c6;      /* 汇报原文那类 */
    --faint: #59617a;     /* 最弱的说明字 */
    --acc: #5eead4;       /* 主强调（项目名、呼吸灯） */
    --acc2: #818cf8;      /* 副强调（数字、竖线） */
    --warn: #fbbf24;
    --bad: #f87171;
    --pink: #f472b6;
    --hover: #182030;     /* 卡片悬停 */
    --inset: #11151f;     /* 内嵌块（汇报、文件 chip） */
    --bar: #232a3a;       /* 进度条底、灰色小块 */
    --lane-bg: #2a2140;   /* 线名色块 */
    --lane-fg: #c4b5fd;
    --btn1: #0f766e;      /* 主按钮渐变两端 */
    --btn2: #115e59;
    --btn-line: #14b8a6;
    --btn-fg: #d6fff8;
    --r: 10px;            /* 卡片圆角 */
    --r-s: 8px;           /* 输入框圆角 */
    --header:
      radial-gradient(120% 180% at 0% 0%, rgba(94, 234, 212, .10), transparent 45%),
      radial-gradient(120% 180% at 100% 0%, rgba(244, 114, 182, .08), transparent 45%),
      linear-gradient(180deg, #171c28, #12161f);
  }

  /* 机甲：钢灰底、警示橙、棱角分明 —— 圆角砍掉，标题拉开字距 */
  [data-theme="mecha"] {
    --bg: #0a0c0f;
    --card: #12161b;
    --card2: #171c22;
    --line: #2c3947;
    --line2: #1d2530;
    --fg: #d8e2e8;
    --dim: #7d8f9c;
    --dim2: #a3b6c2;
    --faint: #55656f;
    --acc: #ff9f43;
    --acc2: #4fc3f7;
    --warn: #ffd166;
    --bad: #ff5252;
    --pink: #ff9f43;
    --hover: #1a222c;
    --inset: #0d1115;
    --bar: #202b36;
    --lane-bg: #3a2a12;
    --lane-fg: #ffc46b;
    --btn1: #b45309;
    --btn2: #92400e;
    --btn-line: #f59e0b;
    --btn-fg: #fff4e0;
    --r: 3px;
    --r-s: 3px;
    --header:
      linear-gradient(90deg, rgba(255, 159, 67, .14), transparent 30%),
      repeating-linear-gradient(-45deg, transparent 0 14px, rgba(255, 159, 67, .05) 14px 16px),
      linear-gradient(180deg, #12161b, #0d1014);
  }
  [data-theme="mecha"] header { border-bottom: 2px solid var(--acc); }
  [data-theme="mecha"] header strong { letter-spacing: 3px; }

  /* 软萌：奶油粉底、圆滚滚 —— 亮色皮，文字换深色 */
  [data-theme="moe"] {
    --bg: #fff5f8;
    --card: #ffffff;
    --card2: #fff0f5;
    --line: #f3d3e0;
    --line2: #f6dde7;
    --fg: #5a4a52;
    --dim: #a58a97;
    --dim2: #8d7581;
    --faint: #c3a9b5;
    --acc: #ec4899;
    --acc2: #a78bfa;
    --warn: #d97706;
    --bad: #e05d6f;
    --pink: #ec4899;
    --hover: #ffe9f1;
    --inset: #fdf2f7;
    --bar: #f6e3ec;
    --lane-bg: #efe6ff;
    --lane-fg: #8b5cf6;
    --btn1: #f472b6;
    --btn2: #ec4899;
    --btn-line: #f9a8d4;
    --btn-fg: #ffffff;
    --r: 14px;
    --r-s: 11px;
    --header:
      radial-gradient(120% 180% at 0% 0%, rgba(244, 114, 182, .16), transparent 50%),
      radial-gradient(120% 180% at 100% 0%, rgba(167, 139, 250, .14), transparent 50%),
      linear-gradient(180deg, #ffffff, #fff0f5);
  }

  /* 简约：浅灰白、一个蓝，别的都闭嘴 */
  [data-theme="minimal"] {
    --bg: #f7f8fa;
    --card: #ffffff;
    --card2: #ffffff;
    --line: #e3e6eb;
    --line2: #e9ecf0;
    --fg: #24292f;
    --dim: #6e7781;
    --dim2: #57606a;
    --faint: #8c959f;
    --acc: #0969da;
    --acc2: #57606a;
    --warn: #9a6700;
    --bad: #cf222e;
    --pink: #0969da;
    --hover: #f0f2f5;
    --inset: #f6f8fa;
    --bar: #eaeef2;
    --lane-bg: #ddf4ff;
    --lane-fg: #0969da;
    --btn1: #1f883d;
    --btn2: #1a7f37;
    --btn-line: #1a7f37;
    --btn-fg: #ffffff;
    --r: 8px;
    --r-s: 6px;
    --header: linear-gradient(180deg, #ffffff, #f7f8fa);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif;
    overflow: hidden;
    user-select: none;
  }

  header {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 46px;
    padding: 0 14px;
    background: var(--header);
    border-bottom: 1px solid var(--line);
  }

  header .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--acc);
    box-shadow: 0 0 10px var(--acc);
    flex: none;
  }

  header strong { font-size: 13.5px; font-weight: 600; letter-spacing: .4px; }
  header .spacer { flex: 1; }

  header button {
    -webkit-app-region: no-drag;
    background: transparent; border: 0; color: var(--dim);
    font-size: 12px; cursor: pointer; padding: 5px 10px; border-radius: var(--r-s);
  }
  header button:hover { background: var(--hover); color: var(--fg); }
  header #min, header #close { font-size: 15px; padding: 4px 9px; line-height: 1; }
  header #chat:hover { color: var(--pink); }

  /* 皮肤选择。挂在头部是因为它改的是整个面板的样子 —— 跟着标题走 */
  header select#skin {
    -webkit-app-region: no-drag;
    width: auto; background: transparent; color: var(--dim);
    border: 1px solid transparent; border-radius: var(--r-s);
    font-size: 11px; padding: 3px 4px; cursor: pointer; outline: none;
  }
  header select#skin:hover { border-color: var(--line); color: var(--fg); }
  header select#skin option { background: var(--card); color: var(--fg); }

  main {
    display: grid;
    grid-template-columns: 350px minmax(0, 1fr);
    gap: 0;
    height: calc(100% - 46px);
  }

  /* ---- 左栏：派活表单 ---- */
  .col-form {
    padding: 12px 14px 14px;
    overflow-y: auto;
    border-right: 1px solid var(--line2);
  }

  /* ---- 右栏：她的状态 + 现场 ---- */
  .col-live {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 12px 14px 14px;
    overflow: hidden;
  }

  /* 心情三条 */
  .stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat {
    flex: 1; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r); padding: 7px 10px;
  }
  .stat .k { font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; }
  .stat .bar { height: 4px; border-radius: 3px; background: var(--bar); margin-top: 6px; overflow: hidden; }
  .stat .bar i { display: block; height: 100%; border-radius: 3px; transition: width .5s ease; }

  #face, #today {
    margin-bottom: 10px; padding: 8px 12px; border-radius: var(--r);
    background: var(--card2); border: 1px solid var(--line);
    font-size: 12px; color: var(--dim);
    flex: none;
  }
  #face b { color: var(--acc); font-weight: 600; }

  /* 「今天」那一栏。全是本地算出来的，看一百遍也不花钱 */
  #today b { color: var(--acc2); font-weight: 600; }
  #today .money { color: var(--warn); }
  #today .note { display: block; font-size: 10px; color: var(--faint); margin-top: 4px; }
  #today .mark {
    display: block; margin-top: 6px; padding: 4px 8px; border-radius: var(--r-s);
    background: var(--bar); color: var(--warn); border-left: 2px solid var(--warn);
  }

  label {
    display: block; font-size: 11px; color: var(--dim);
    margin: 11px 0 5px; letter-spacing: .5px;
  }
  .col-form > label:first-child { margin-top: 0; }
  .col-live label { flex: none; }

  .row { display: flex; gap: 6px; }
  .row > * { min-width: 0; }

  input, textarea, select {
    width: 100%; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: var(--r-s);
    padding: 8px 10px; font: inherit; outline: none;
    user-select: text;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--acc2); }
  textarea { resize: none; line-height: 1.7; }
  select { cursor: pointer; }

  /* 分支状态。干净是灰的，有没提交的改动就转成警告色 —— 那一眼是这条的全部价值 */
  .gitinfo {
    font-size: 11px; color: var(--faint); margin-top: 5px; padding: 0 2px;
    min-height: 16px;
  }
  .gitinfo.dirty { color: var(--warn); }

  button.btn {
    background: var(--card2); color: var(--fg);
    border: 1px solid var(--line); border-radius: var(--r-s);
    padding: 9px 14px; font: inherit; cursor: pointer; white-space: nowrap;
  }
  button.btn:hover { border-color: var(--acc2); }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }

  button.primary {
    background: linear-gradient(135deg, var(--btn1), var(--btn2));
    border-color: var(--btn-line); color: var(--btn-fg); font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.12); box-shadow: 0 0 14px var(--btn-line); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 3px 10px; font-size: 11px; color: var(--dim); cursor: pointer;
  }
  .chip:hover { border-color: var(--acc); color: var(--fg); }

  .btns { margin-top: 14px; }
  .btns .btn { flex: 1; text-align: center; }

  #msg {
    margin-top: 10px; font-size: 12px; min-height: 18px;
    padding: 0 2px; word-break: break-all;
  }
  #msg.ok { color: var(--acc); }
  #msg.err { color: var(--bad); }
  #ver {
    color: var(--dim); font-size: 11px; margin-left: 2px;
    /* 标题栏整条是拖拽区（-webkit-app-region: drag），落在里面的元素点击
       会被窗口拖拽整个吃掉 —— 「点我更新」死点没反应就是栽在这儿（实机反馈）。
       跟 header button 一样豁免出来 */
    -webkit-app-region: no-drag;
  }
  #ver.upd {
    color: var(--acc); border: 1px solid var(--acc); border-radius: var(--r-s);
    padding: 1px 7px; cursor: pointer;
  }
  #msg button {
    margin-left: 8px; background: transparent; border: 1px solid var(--acc);
    color: var(--acc); border-radius: var(--r-s); font-size: 11px;
    padding: 1px 8px; cursor: pointer;
  }

  .job {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r); padding: 8px 10px; margin-bottom: 6px;
  }
  .job .t { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .job .n { color: var(--acc); font-weight: 600; font-size: 12px; }
  .job .meta { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .job .d { font-size: 11px; color: var(--dim); margin-top: 4px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job button {
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    border-radius: var(--r-s); font-size: 11px; padding: 2px 8px; cursor: pointer;
  }
  .job button:hover { border-color: var(--bad); color: var(--bad); }

  .empty { color: var(--faint); font-size: 12px; padding: 6px 2px; }

  /* ---- 开着的终端 ---- */
  label .count {
    display: inline-block; margin-left: 6px;
    background: var(--bar); color: var(--acc);
    border-radius: 10px; padding: 0 7px;
    font-size: 10px; letter-spacing: 0;
  }
  label .count.zero { background: var(--bar); color: var(--faint); }

  /* 终端列表在右栏里自己滚，别再拖着整个面板一起滚 */
  #terms {
    flex: 1;
    min-height: 60px;
    overflow-y: auto;
    padding-right: 2px;
  }
  #running {
    flex: none;
    max-height: 132px;
    overflow-y: auto;
  }

  .term {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r); padding: 8px 10px; margin-bottom: 6px;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .term:hover { border-color: var(--acc); background: var(--hover); }
  .term .t { display: flex; align-items: center; gap: 7px; }
  .term .n { color: var(--acc); font-weight: 600; font-size: 12px; flex: 1;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 呼吸灯：跑着的绿、等你确认的黄、干完的灰 */
  .term .led { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .term.run  .led { background: #34d399; box-shadow: 0 0 7px #34d399; animation: pulse 1.8s ease-in-out infinite; }
  .term.wait .led { background: var(--warn); box-shadow: 0 0 7px var(--warn); }
  .term.idle .led { background: var(--faint); }
  /* 已完成：整条压暗，但**留在列表上** —— 窗口都关了，这是「干成什么样」唯一的痕迹。
     压暗是为了让还在跑的那些一眼跳出来，不是为了藏它 */
  .term.closed { opacity: .62; }
  .term.closed .led { background: #3f7d5c; box-shadow: none; }
  /* 干砸的（非零退出）：灰行也要看得出是红的 */
  .term.bad .led { background: #f87171; box-shadow: none; }
  /* 还在跑但连着报错：绿灯换红闪；卡住没动静：黄灯 */
  .term.strug .led { background: #f87171; box-shadow: 0 0 7px #f87171; animation: pulse 1.2s ease-in-out infinite; }
  .term.stuckled .led { background: var(--warn); box-shadow: 0 0 7px var(--warn); }
  .gitinfo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #lanes { margin-top: 4px; }
  #lanes .chip { margin-right: 4px; }
  .daily { font-size: 11px; color: var(--dim); margin-top: 5px; line-height: 1.8; }
  .daily b { color: var(--fg); }
  .term .warnline {
    font-size: 11px; color: var(--bad); margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .term.closed .n { color: var(--faint); }
  .term.closed:hover { opacity: .85; }
  @keyframes pulse { 50% { opacity: .35; } }

  label .sub {
    float: right; font-weight: 400; color: var(--faint);
    text-transform: none; letter-spacing: 0;
  }

  /* 线名。同一个目录能开好几条，这个是你区分它们的**唯一**依据，
     所以给它一个显眼的色块，别让它跟项目名混在一起 */
  .term .lane {
    display: inline-block; margin-left: 6px; padding: 0 6px;
    background: var(--lane-bg); color: var(--lane-fg); border-radius: 4px;
    font-size: 10px; font-weight: 600; vertical-align: 1px;
    max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .term.closed .lane { background: var(--bar); color: var(--faint); }

  .term .meta { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .term .phase {
    font-size: 11px; color: var(--dim2); margin-top: 5px;
    padding: 5px 8px; background: var(--inset); border-radius: var(--r-s);
    border-left: 2px solid var(--acc2);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .term .go { font-size: 10px; color: var(--faint); }
  .term:hover .go { color: var(--acc); }

  /* 这条线烧了多少钱 */
  .term .cost {
    float: right; color: var(--warn); font-variant-numeric: tabular-nums;
  }

  /* 她动过的文件。这是「她干了什么」最硬的证据，点一下能跳过去 */
  .files { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .files .f {
    background: var(--inset); border: 1px solid var(--line); border-radius: 5px;
    padding: 1px 6px; font-size: 10px; color: var(--dim2); cursor: pointer;
    max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .files .f:hover { border-color: var(--acc); color: var(--fg); }
  .files .f.more { cursor: default; color: var(--faint); border-style: dashed; }
  .files .f.more:hover { border-color: var(--line); color: var(--faint); }

  .term .again { color: var(--dim); }
  .term .again:hover { border-color: var(--acc); color: var(--acc); }
  .term .x {
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    border-radius: var(--r-s); font-size: 11px; padding: 1px 7px; cursor: pointer;
  }
  .term .x:hover { border-color: var(--bad); color: var(--bad); }

  /* 手机工作台的二维码弹层 */
  .qr-mask {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(5, 7, 12, .72);
    display: flex; align-items: center; justify-content: center;
  }
  .qr-box {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 18px 22px; text-align: center; max-width: 340px;
  }
  .qr-box h3 { margin: 0 0 10px; font-size: 14px; color: var(--acc); }
  #qr-img img { width: 220px; height: 220px; image-rendering: pixelated; background: #fff; padding: 10px; border-radius: 8px; }
  .qr-urls { font-size: 11px; color: var(--dim); margin-top: 8px; word-break: break-all; user-select: text; }
  .qr-hint { font-size: 11px; color: var(--faint); margin: 8px 0 10px; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--bar); border-radius: 4px; }
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <strong>给她派个活</strong>
    <span id="ver" title="当前版本"></span>
    <span class="spacer"></span>
    <select id="skin" title="面板换个皮肤，换完就记住">
      <option value="deep">深空</option>
      <option value="mecha">机甲</option>
      <option value="moe">软萌</option>
      <option value="minimal">简约</option>
    </select>
    <button id="mobile" title="手机工作台：扫码在手机上派活、看实时进度、远程放行">手机</button>
    <button id="docs" title="功能手册：她会什么、怎么玩、哪些花钱，全在这一页里">说明书</button>
    <button id="chat" title="不干活，就聊聊天">私聊</button>
    <button id="min" title="收起来（缩到任务栏，填的东西都留着）">−</button>
    <button id="close" title="关闭">✕</button>
  </header>

  <main>
    <!-- 左栏：派活表单，从上到下一气填完，不用滚 -->
    <div class="col-form">
      <label>项目目录</label>
      <div class="row">
        <input id="dir" spellcheck="false" placeholder="D:\你的项目" />
        <button class="btn" id="browse">浏览</button>
      </div>
      <!-- 派活之前先看一眼在哪个分支、干不干净。不是 git 仓库就整条不出现 -->
      <div class="gitinfo" id="gitinfo"></div>
      <div id="lanes"></div>
      <div class="chips" id="recent"></div>

      <label>要她做什么</label>
      <textarea id="task" rows="6"
        placeholder="说人话就行，比如：&#10;把登录页的表单校验补上，手机号和验证码都要校验&#10;&#10;（Ctrl+Enter 直接派活）"></textarea>

      <label>这条线叫什么<span class="sub">自动从上面取，可以改</span></label>
      <input id="lane" spellcheck="false" placeholder="（自动）" />

      <label>用谁来干<span class="sub">没装 Claude 的机器选 Codex 也能派活</span></label>
      <select id="agent">
        <option value="claude">Claude Code —— 全套：她盯着、汇报、算钱</option>
        <option value="codex">Codex —— 只开窗干活，她不盯细节</option>
      </select>

      <label>用哪个模型<span class="sub">选一次就记住，两种派法都用它</span></label>
      <select id="model">
        <option value="">跟 Claude Code 自己的设置走</option>
        <option value="claude-opus-5">Opus 5 —— 主力，复杂的活交给它</option>
        <option value="claude-sonnet-5">Sonnet 5 —— 快，便宜差不多一半</option>
        <option value="claude-haiku-4-5">Haiku 4.5 —— 最快最省，简单活</option>
        <option value="claude-fable-5">Fable 5 —— 最强也最贵（Opus 两倍价）</option>
      </select>

      <label>这次放她多开<span class="sub">只管这一次</span></label>
      <select id="perm">
        <option value="">按设置里的默认</option>
        <option value="auto">自己判断 · 安全的放行，危险的拦下</option>
        <option value="acceptEdits">改文件不问 · 但跑命令还是要问你</option>
        <option value="plan">先出方案 · 一个字都不改</option>
        <option value="dontAsk">全都别问 · 她自己拿主意</option>
      </select>

      <div class="row btns">
        <button class="btn primary" id="go">让她后台干</button>
        <button class="btn" id="term">开终端我看着</button>
      </div>

      <div id="msg"></div>
    </div>

    <!-- 右栏：她的状态 + 手上的活。列表自己滚，不挤表单 -->
    <div class="col-live">
      <div class="stats">
        <div class="stat">
          <div class="k"><span>精力</span><span id="v-energy">–</span></div>
          <div class="bar"><i id="b-energy" style="width:0%;background:#5eead4"></i></div>
        </div>
        <div class="stat">
          <div class="k"><span>心情</span><span id="v-mood">–</span></div>
          <div class="bar"><i id="b-mood" style="width:0%;background:#818cf8"></i></div>
        </div>
        <div class="stat">
          <div class="k"><span>亲密</span><span id="v-aff">–</span></div>
          <div class="bar"><i id="b-aff" style="width:0%;background:#f472b6"></i></div>
        </div>
      </div>

      <div id="face">此刻状态：<b id="state">–</b><span id="hint"></span></div>

      <div id="today">今天还没开工。</div>
      <div id="daily" class="daily"></div>

      <label>她手上的活<span class="count zero" id="term-count">0</span></label>
      <div id="terms"><div class="empty">还没派活。点一条就能把那个终端调出来看现场</div></div>

      <label>无窗口后台任务</label>
      <div id="running"><div class="empty">没有（后台派活默认开的是最小化终端，在上面那栏）</div></div>
    </div>
  </main>

  <div id="qr-mask" class="qr-mask" style="display:none">
    <div class="qr-box">
      <h3>手机工作台</h3>
      <div id="qr-img"></div>
      <div class="qr-urls" id="qr-urls"></div>
      <p class="qr-hint">手机跟电脑连同一个 Wi-Fi，扫码即入；也可以「复制链接」发给自己。<br><b>关掉这个窗口不会断开手机</b>——服务一直开着，桌宠退出才停。<br>地址里带着口令，别把截图发到群里。</p>
      <button class="chip" id="qr-go" style="margin-right:6px">出门模式（不同网络也能用）</button>
      <button class="chip" id="qr-copy" style="margin-right:6px">复制链接</button>
      <button class="chip" id="qr-close">关闭</button>
      <p class="qr-hint" id="qr-tip" style="margin-top:8px"></p>
    </div>
  </div>
  <script src="../../vendor/qrcode.js"></script>
  <script src="panel.js"></script>
</body>
</html>
