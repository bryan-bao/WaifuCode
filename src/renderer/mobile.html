<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>小依 · 手机工作台</title>
<style>
  /* 跟桌面面板同一套「深空」配色 —— 换皮肤是第二批的事，先把结构立住 */
  :root {
    --bg: #0d0f16; --card: #161a24; --card2: #1c2231; --line: #272e3f;
    --fg: #e6e8f0; --dim: #8b93a7; --faint: #59617a;
    --acc: #5eead4; --acc2: #818cf8; --warn: #fbbf24; --bad: #f87171;
    --lane-bg: #2a2140; --lane-fg: #c4b5fd;
    --btn1: #0f766e; --btn2: #115e59; --btn-line: #14b8a6; --btn-fg: #d6fff8;
    --r: 12px; --r-s: 9px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  body { padding: 12px 12px calc(20px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 8px; padding: 4px 2px 10px; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 10px var(--acc); }
  header strong { font-size: 16px; }
  header .sub { color: var(--dim); font-size: 12px; margin-left: auto; text-align: right; }
  #net { font-size: 11px; }
  #net.on { color: var(--acc); }
  #net.off { color: var(--bad); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 8px; font-size: 13px; color: var(--dim); font-weight: 600; letter-spacing: .5px; }

  input, textarea, select {
    width: 100%; background: var(--card2); border: 1px solid var(--line); color: var(--fg);
    border-radius: var(--r-s); padding: 10px 12px; font: inherit; outline: none; margin-bottom: 8px;
  }
  textarea { min-height: 76px; resize: vertical; }
  .row2 { display: flex; gap: 8px; }
  .row2 > * { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip {
    background: var(--card2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 999px; padding: 5px 12px; font-size: 12px;
  }
  .chip.on { border-color: var(--acc); color: var(--acc); }

  button.go {
    width: 100%; padding: 12px; border-radius: var(--r-s); border: 1px solid var(--btn-line);
    background: linear-gradient(180deg, var(--btn1), var(--btn2)); color: var(--btn-fg);
    font: inherit; font-weight: 600;
  }
  button:disabled { opacity: .5; }
  #msg { min-height: 20px; font-size: 12px; padding: 4px 2px; }
  #msg.ok { color: var(--acc); }
  #msg.err { color: var(--bad); }

  .term { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 12px; margin-bottom: 10px; }
  .term .t { display: flex; align-items: center; gap: 7px; }
  .term .led { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .term.run .led { background: #34d399; box-shadow: 0 0 7px #34d399; animation: pulse 1.8s infinite; }
  .term.wait .led { background: var(--warn); box-shadow: 0 0 7px var(--warn); }
  .term.strug .led { background: var(--bad); box-shadow: 0 0 7px var(--bad); animation: pulse 1.2s infinite; }
  .term.closed { opacity: .62; }
  .term.bad .led { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }
  .term .name { color: var(--acc); font-weight: 600; font-size: 14px; }
  .term .lane { background: var(--lane-bg); color: var(--lane-fg); border-radius: 5px; font-size: 11px; padding: 1px 7px; }
  .term .cost { margin-left: auto; color: var(--warn); font-size: 12px; }
  .term .meta { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .term .phase { color: #a9b2c6; font-size: 13px; margin-top: 6px; border-left: 2px solid var(--acc2); padding-left: 8px; }
  .term .warnline { color: var(--bad); font-size: 12px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .approve { margin-top: 10px; background: var(--card2); border: 1px solid var(--warn); border-radius: var(--r-s); padding: 10px; }
  .approve .q { font-size: 13px; color: var(--warn); margin-bottom: 8px; word-break: break-all; }
  .approve .btns { display: flex; gap: 8px; }
  .approve button { flex: 1; padding: 11px; border-radius: var(--r-s); font: inherit; font-weight: 600; border: 1px solid; }
  .approve .yes { background: #14532d; border-color: #22c55e; color: #dcfce7; }
  .approve .no { background: #450a0a; border-color: var(--bad); color: #fee2e2; }

  .empty { color: var(--faint); text-align: center; padding: 18px 0; font-size: 13px; }

  .term { cursor: pointer; }
  .term .more { color: var(--faint); font-size: 11px; margin-top: 5px; }

  /* 详情页：整屏盖上来（手机上分屏没意义） */
  .sheet {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    overflow-y: auto; padding: 12px 12px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet header { position: sticky; top: 0; background: var(--bg); z-index: 2; padding-top: 6px; }
  .sheet .back {
    background: var(--card2); border: 1px solid var(--line); color: var(--fg);
    border-radius: var(--r-s); padding: 7px 14px; font: inherit; font-size: 13px;
  }
  .tl { border-left: 2px solid var(--line); margin: 4px 0 0 6px; padding-left: 12px; }
  .tl .e { margin-bottom: 12px; position: relative; }
  .tl .e::before {
    content: ''; position: absolute; left: -17px; top: 7px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--faint);
  }
  .tl .e.you::before { background: var(--acc2); }
  .tl .e.her::before { background: var(--acc); }
  .tl .e.error::before { background: var(--bad); }
  .tl .e.wait::before { background: var(--warn); }
  .tl .e .when { font-size: 11px; color: var(--faint); }
  .tl .e .who { font-size: 11px; color: var(--dim); margin-right: 6px; }
  .tl .e.you .who { color: var(--acc2); }
  .tl .e.her .who { color: var(--acc); }
  .tl .e.error .who { color: var(--bad); }
  .tl .e .txt { font-size: 13px; color: #cdd3e0; white-space: pre-wrap; word-break: break-word; }
  /* 「查看全部」展开的那块。手机上排版最容易乱的就是这儿，三条底线：
     1) 长英文/路径必须能断（overflow-wrap: anywhere），否则整行撑破屏幕
     2) 代码块自己横向滚（pre 里不换行会顶宽，换行又毁缩进 —— 给它独立滚动条）
     3) 整块 max-width:100% + box-sizing，父容器再窄也不外溢 */
  .quick { margin: 2px 0 8px; }
  .quick .chip { font-size: 12px; padding: 6px 11px; }
  .tl .e .seeall {
    margin-top: 5px; font-size: 11.5px; color: var(--acc); background: none;
    border: 0; padding: 2px 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .tl .e .seeall:active { opacity: .6; }
  .full {
    margin-top: 7px; padding: 9px 10px; border-radius: 9px;
    background: rgba(255,255,255,.03); border: 1px solid var(--line);
    max-width: 100%; box-sizing: border-box; overflow: hidden;
  }
  /* 排版按 markdown 的骨架来 —— 原来整段裸着 pre-wrap，井号星号横杠全露在
     外面，密密麻麻读不下去（用户实拍）。**不要 pre-wrap**：段落交给 <p>，
     换行交给 <br>，只有代码块才保原样 */
  .full .seg { font-size: 13px; line-height: 1.78; color: #d7dce8; overflow-wrap: anywhere; }
  .full .seg + .seg { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .full .seg p { margin: 0 0 8px; }
  .full .seg p:last-child { margin-bottom: 0; }
  .full .seg .h {
    font-weight: 600; color: var(--acc); font-size: 13px;
    margin: 12px 0 6px; padding-left: 8px; border-left: 2px solid var(--acc);
  }
  .full .seg .h:first-child { margin-top: 0; }
  .full .seg .li {
    position: relative; padding-left: 15px; margin: 3px 0;   /* 悬挂缩进：第二行跟第一行对齐 */
  }
  .full .seg .li::before {
    content: '•'; position: absolute; left: 2px; color: var(--acc2);
  }
  .full .seg .li.n::before { content: attr(data-n); left: 0; font-size: 11px; top: 1px; }
  .full .seg b { color: #eef1f8; font-weight: 600; }
  .full .seg code {
    font-family: Consolas, Menlo, monospace; font-size: 11.5px;
    background: #0a0c12; border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; color: var(--acc); overflow-wrap: anywhere;
  }
  .full .seg pre {
    font-family: Consolas, Menlo, monospace; font-size: 11.5px;
    margin: 8px 0; padding: 8px 10px; border-radius: 7px; background: #0a0c12;
    border: 1px solid var(--line); overflow-x: auto; white-space: pre; max-width: 100%;
  }
  .full .tools { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line); }
  .full .tools .cap { font-size: 11px; color: var(--dim); margin-bottom: 5px; }
  /* 一个工具一块。命令可以很长（几百字符），所以 max-width 卡死 + 单行省略号
     —— nowrap 而不限宽的话，一块就把整个容器顶破（实测量出来 522>263） */
  .full .tools .t {
    display: block; max-width: 100%; margin: 0 0 4px;
    background: var(--card2); border: 1px solid var(--line); border-radius: 5px;
    font-size: 10.5px; color: var(--faint); padding: 3px 7px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .full .none { font-size: 12px; color: var(--faint); }
  .files { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .files .f { background: var(--card2); border: 1px solid var(--line); color: var(--dim); border-radius: 6px; font-size: 11px; padding: 2px 7px; }

  /* 说一句：吸在底部，手机上手够得到 */
  .say {
    position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 4px;
    border-top: 1px solid var(--line); margin-top: 10px;
  }
  .say .row { display: flex; gap: 8px; align-items: flex-end; }
  .say textarea { min-height: 46px; margin: 0; }
  .say button {
    flex: none; padding: 12px 16px; border-radius: var(--r-s); border: 1px solid var(--btn-line);
    background: linear-gradient(180deg, var(--btn1), var(--btn2)); color: var(--btn-fg); font: inherit; font-weight: 600;
  }

  /* 文件夹选择器 */
  .picker { position: fixed; inset: 0; z-index: 70; background: var(--bg); overflow-y: auto; padding: 12px; }
  .picker .cwd { font-size: 12px; color: var(--dim); word-break: break-all; margin: 6px 0 10px; }
  .picker .item {
    display: flex; align-items: center; gap: 8px; padding: 12px 10px;
    border-bottom: 1px solid var(--line2, #1b2130); font-size: 14px;
  }
  .picker .item .tag { margin-left: auto; font-size: 11px; color: var(--acc); }
  .picker .bar { display: flex; gap: 8px; position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; }
  .picker .bar button { flex: 1; padding: 12px; border-radius: var(--r-s); font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card2); color: var(--fg); }
  .picker .bar .use { border-color: var(--btn-line); background: linear-gradient(180deg, var(--btn1), var(--btn2)); color: var(--btn-fg); }
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <strong id="who">小依</strong>
    <span class="sub"><span id="net" class="off">连接中…</span><br><span id="today"></span></span>
  </header>

  <div class="card">
    <h3>派个活（就在电脑上那些终端里干）</h3>
    <select id="target"><option value="">开一条新的线</option></select>
    <div class="chips" id="projects"></div>
    <div class="row2" style="align-items:center">
      <input id="dir" placeholder="项目目录" spellcheck="false" style="margin-bottom:0" />
      <button id="pick" style="flex:none;padding:10px 14px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--card2);color:var(--fg);font:inherit">选文件夹</button>
    </div>
    <div style="height:8px"></div>
    <!-- 手机上敲字费劲：常用的活做成一按就填。点一下填进下面的框，
         还能接着改（不是点了就发 —— 派活是花钱的事，得让你过一眼） -->
    <div class="chips quick" id="quick"></div>
    <textarea id="task" placeholder="要干什么活"></textarea>
    <div class="row2">
      <select id="agent">
        <option value="claude">Claude Code</option>
        <option value="codex">Codex</option>
      </select>
      <select id="model">
        <option value="">模型：跟电脑上的设置走</option>
        <option value="claude-opus-5">Opus 5 · 主力</option>
        <option value="claude-sonnet-5">Sonnet 5 · 快，省一半</option>
        <option value="claude-haiku-4-5">Haiku 4.5 · 最快最省</option>
        <option value="claude-fable-5">Fable 5 · 最强也最贵</option>
      </select>
    </div>
    <div class="row2">
      <select id="perm">
        <option value="">权限：默认</option>
        <option value="auto">自己判断</option>
        <option value="acceptEdits">改文件不问</option>
        <option value="plan">按计划来</option>
        <option value="dontAsk">全都不问</option>
      </select>
    </div>
    <button class="go" id="go">派活</button>
    <div id="msg"></div>
  </div>

  <h3 style="margin:2px 4px 8px;font-size:13px;color:var(--dim);">她手上的活</h3>
  <div id="terms"><div class="empty">加载中…</div></div>

<div id="sheet" class="sheet" style="display:none"></div>
<div id="picker" class="picker" style="display:none"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const token = new URLSearchParams(location.search).get('t') || '';
  const api = (p) => p + (p.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(token);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let msgTimer = null;
  function msg(text, kind) {
    const el = $('msg');
    el.textContent = text || '';
    el.className = kind || '';
    clearTimeout(msgTimer);
    if (text) msgTimer = setTimeout(() => { el.textContent = ''; el.className = ''; }, 8000);
  }

  const STATUS = {
    running: ['run', '干着呢'], waiting: ['wait', '在等确认'], idle: ['idle', '这轮完事了'],
    done: ['idle', '干完了，窗口还开着'], closed: ['closed', '已完成'],
  };
  const fmtDur = (ms) => {
    const m = Math.round((ms || 0) / 60000);
    return m < 60 ? m + ' 分钟' : Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分';
  };
  const money = (usd) => (usd > 0.004 ? '¥' + (usd * 7.2).toFixed(2) : '');

  // 放行是把确认键送进电脑上的终端窗口 —— 手机上必须二次确认，误触不可逆
  async function approve(id, allow, name) {
    const word = allow ? '放行' : '拒绝';
    if (!confirm('确定' + word + '「' + name + '」这次操作？')) return;
    try {
      const r = await fetch(api('/api/approve'), {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id, allow }),
      }).then((x) => x.json());
      msg(r.ok ? word + '的按键已送到电脑上，几秒后看这条线的状态' : (r.error || '没送到'), r.ok ? 'ok' : 'err');
    } catch (e) { msg('网络断了？' + e.message, 'err'); }
  }

  // 「派给谁」：开新线，还是接着电脑上已经开着的某条线说。
  // 后者走的是「往那个终端里打一句话」—— 跟你走到电脑前敲进去一模一样，
  // 不会另开窗口（这正是手机远程办公的关键：接着干，不是重新开一摊）
  function syncTargetUI() {
    const live = $('target').value !== '';
    $('dir').parentElement.style.display = live ? 'none' : 'flex';
    $('agent').parentElement.style.display = live ? 'none' : 'flex';
    // 模型只对 claude 有意义 —— codex CLI 不收这个参数，摆着是骗人
    const mrow = $('model').parentElement;
    mrow.style.display = (live || $('agent').value === 'codex') ? 'none' : 'flex';
    $('projects').style.display = live ? 'none' : 'flex';
    $('task').placeholder = live ? '接着说一句（直接进那个终端）' : '要干什么活';
    $('go').textContent = live ? '发给那条线' : '派活';
    if (typeof syncQuickHint === 'function') syncQuickHint();
  }
  $('target').onchange = syncTargetUI;
  $('agent').onchange = syncTargetUI; // 切到 codex 要把模型那行藏起来

  function render(s) {
    if (!s) return;
    $('who').textContent = s.name || '小依';
    $('today').textContent = (s.mood ? s.mood + ' · ' : '') + '今天 ' + (money(s.todayUsd) || '¥0');

    // 「派给谁」下拉：把电脑上还开着的线列出来
    const sel = $('target');
    const keep = sel.value;
    const live = (s.terminals || []).filter((t) => t.status !== 'closed');
    sel.innerHTML = '<option value="">开一条新的线</option>' +
      live.map((t) => '<option value="' + esc(t.id) + '">接着「' +
        esc((t.project || t.name) + (t.laneName ? ' · ' + t.laneName : '')) + '」说</option>').join('');
    sel.value = live.some((t) => t.id === keep) ? keep : '';
    syncTargetUI();

    // 项目 chips
    const pj = $('projects');
    pj.innerHTML = '';
    for (const p of (s.projects || []).slice(0, 6)) {
      const c = document.createElement('span');
      c.className = 'chip' + ($('dir').value === p.path ? ' on' : '');
      c.textContent = p.name;
      c.onclick = () => { $('dir').value = p.path; render(s); };
      pj.appendChild(c);
    }

    // 终端列表
    const box = $('terms');
    box.innerHTML = '';
    const list = s.terminals || [];
    if (!list.length) { box.innerHTML = '<div class="empty">还没派活。上面派一个，进度会在这儿实时走</div>'; return; }
    for (const t of list) {
      let [cls, word] = STATUS[t.status] || STATUS.idle;
      const crashed = (t.status === 'done' || t.status === 'closed') && t.exitCode !== null && t.exitCode !== 0;
      if (crashed) { cls += ' bad'; word = '异常退出（code ' + t.exitCode + '）'; }
      if (t.struggling) cls += ' strug';

      const el = document.createElement('div');
      el.className = 'term ' + cls;
      el.innerHTML =
        '<div class="t"><span class="led"></span><span class="name">' + esc(t.project || t.name) + '</span>' +
        (t.laneName ? '<span class="lane">' + esc(t.laneName) + '</span>' : '') +
        (money(t.costUsd) ? '<span class="cost">' + money(t.costUsd) + '</span>' : '') + '</div>' +
        '<div class="meta">' + word + ' · ' + fmtDur(t.elapsedMs) +
        (t.turns ? ' · ' + t.turns + ' 轮' : '') +
        (t.errorCount ? ' · 报错 ' + t.errorCount + ' 次' : '') +
        (t.stuckMin ? ' · 卡了 ' + t.stuckMin + ' 分钟' : '') + '</div>' +
        ((t.lastReport || t.lastPrompt || t.task)
          ? '<div class="phase">' + esc(t.lastReport || (t.lastPrompt ? '这轮在干：' + t.lastPrompt : t.task)) + '</div>' : '') +
        (t.errorCount > 0 && t.lastError ? '<div class="warnline">⚠ ' + esc(t.lastError) + '</div>' : '');

      // 点一下进详情页 —— 看进度、继续说、放行都在里面
      el.onclick = (ev) => { if (!ev.target.closest('.approve')) openDetail(t.id); };
      const more = document.createElement('div');
      more.className = 'more';
      more.textContent = '点开看进度 · 继续说 ›';
      el.appendChild(more);

      if (t.status === 'waiting') {
        const ap = document.createElement('div');
        ap.className = 'approve';
        ap.innerHTML = '<div class="q">她在等你确认' + (t.waitDetail ? '：' + esc(t.waitDetail) : '这次操作') + '</div>';
        const btns = document.createElement('div');
        btns.className = 'btns';
        const yes = document.createElement('button');
        yes.className = 'yes'; yes.textContent = '放行';
        yes.onclick = () => approve(t.id, true, t.project || t.name);
        const no = document.createElement('button');
        no.className = 'no'; no.textContent = '拒绝';
        no.onclick = () => approve(t.id, false, t.project || t.name);
        btns.append(yes, no);
        ap.appendChild(btns);
        el.appendChild(ap);
      }
      box.appendChild(el);
    }
  }

  // ── 任务详情页：时间线 + 继续说 ──────────────────────────────────────
  let openId = null;   // 正开着哪条线的详情（null = 在首页）
  const KIND = { you: '你说', her: '她说', error: '报错', wait: '等确认' };

  async function openDetail(id) {
    openId = id;
    fullCache = null; // 换了条线，上一条的完整对话作废（不清就会张冠李戴）
    $('sheet').style.display = 'block';
    $('sheet').innerHTML = '<div class="empty">加载中…</div>';
    await refreshDetail();
  }
  function closeDetail() {
    openId = null;
    fullCache = null;
    $('sheet').style.display = 'none';
    $('sheet').innerHTML = '';
  }

  // 手机上敲长句子太痛苦，这几条一按就走。
  //
  // 【分两类，这是关键】
  //   cmd  —— **直接打进终端的命令**，跟你在电脑前敲一模一样：不问模型、
  //           一分钱不花、瞬间出结果（`!` 是 Claude Code 的跑命令前缀，
  //           `/` 开头是它自己的斜杠命令）。查状态、看日志这类本来就该这么干 ——
  //           让模型转述一遍既慢又花钱（用户点出来的）。
  //   ask  —— 真的需要她动脑子的（"上次干到哪、下一步干什么"），才走派活。
  //
  // 选了「接着某条线说」时，cmd 直接发过去；开新线时终端还不存在，
  // 只能先把 ask 填进任务框（新线的第一句必须是给模型的 prompt）。
  const QUICK = [
    { label: '改了啥', cmd: '!git status -sb', ask: '看一下现在的 git 状态和没提交的改动，说说结论。' },
    { label: '最近提交', cmd: '!git log --oneline -12', ask: '看一下最近十几条提交，说说这阵子在干什么。' },
    { label: '跑自检', cmd: '!npm test', ask: '把自检跑一遍，没过的告诉我是哪条、为什么，先别自己改。' },
    { label: '花了多少', cmd: '/cost', ask: '' },
    { label: '上次干到哪', cmd: '', ask: '先别改东西。看一下最近的 git log 和没提交的改动，' +
        '再翻一眼项目里的进度记录，用大白话告诉我上次干到哪儿了、下一步该干什么。' },
    { label: '接着上次', cmd: '', ask: '接着上次没做完的事往下做。先说你打算怎么干，我点头了再动手。' },
  ];

  // 模型选完记在这台手机上 —— 电脑面板是存进配置的，手机这边只记本地，
  // 免得手机上随手一选把电脑的默认改了（那是两个人的习惯）
  try {
    const savedModel = localStorage.getItem('waifu.model');
    if (savedModel) $('model').value = savedModel;
  } catch (_) { /* 无痕模式之类，不记就不记 */ }
  $('model').onchange = () => {
    try { localStorage.setItem('waifu.model', $('model').value); } catch (_) { /* 同上 */ }
  };

  (function fillQuick() {
    const box = $('quick');
    if (!box) return;
    for (const q of QUICK) {
      const c = document.createElement('span');
      c.className = 'chip';
      c.textContent = q.label;
      c.dataset.cmd = q.cmd || '';
      c.title = q.cmd ? '直接在那条终端里跑：' + q.cmd + '（不花钱）' : q.ask;
      c.onclick = async () => {
        const to = $('target').value;
        // 选了已有的线 + 这条有命令 → 直接打进终端，不惊动模型
        if (to && q.cmd) {
          c.classList.add('on');
          try {
            const r = await fetch(api('/api/send'), {
              method: 'POST', headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ id: to, text: q.cmd }),
            }).then((x) => x.json());
            msg(r && r.ok ? '「' + q.cmd + '」发过去了，点开那条线看结果（没花钱）'
                          : ((r && r.error) || '没发出去'), r && r.ok ? 'ok' : 'err');
          } catch (e) { msg('网络断了？' + e.message, 'err'); }
          setTimeout(() => c.classList.remove('on'), 600);
          return;
        }
        // 开新线（或这条本来就要动脑子）：填进任务框，你过一眼再派
        const text = q.ask || q.cmd;
        if (!text) { msg('这条得先在上面选一条线', 'err'); return; }
        $('task').value = text;
        $('task').focus();
        msg(to ? '填好了，点「发给那条线」' : '填好了，看一眼就能派', 'ok');
      };
      box.appendChild(c);
    }
  })();

  // 选了哪条线会改变这排按钮的含义（直接跑 vs 填进框），标一下
  function syncQuickHint() {
    const live = $('target').value !== '';
    for (const c of document.querySelectorAll('#quick .chip')) {
      if (!c.dataset.cmd) continue;
      c.style.opacity = live ? '1' : '.72';
      c.textContent = live ? '▶ ' + c.textContent.replace(/^▶ /, '') : c.textContent.replace(/^▶ /, '');
    }
  }

  // 这条线的完整对话（按轮切开）。**一条线只拉一次**：点第二段时直接用缓存，
  // 手机流量和电脑读盘都省了；退出详情时清掉（换条线数据就不对了）
  let fullCache = null;
  let sayDraft = '';   // 输入框里打了一半的字。存在 DOM 外面 —— 重建冲不掉
  async function loadFull() {
    if (fullCache) return fullCache;
    const r = await fetch(api('/api/full?id=' + encodeURIComponent(openId))).then((x) => x.json());
    fullCache = r;
    return r;
  }

  /** 把 markdown 里的代码块拆出来单独用 <pre>（其余按纯文本走，不做全量 md 解析
   *  —— 手机上要的是「看清楚她说了什么」，不是排版比赛） */
  /**
   * 她的输出是 markdown（标题、列表、粗体、行内代码）。原来整段塞进一个
   * pre-wrap 的 div —— 井号、星号、横杠全裸着，密密麻麻一大坨，手机上根本
   * 读不下去（用户实拍「看着不舒服，显示也很乱」）。
   *
   * 这儿做一层**够用就好**的排版：代码块单独滚、标题加粗成小节、列表挂个圆点
   * 带悬挂缩进、粗体和行内代码上色、空行分段。不做完整 markdown 解析 ——
   * 手机上要的是「看清楚她说了什么」，不是排版比赛。
   */
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  }

  function segHtml(text) {
    const parts = String(text).split(/```/);
    return parts.map((p, i) => {
      // 奇数段 = 三个反引号中间的代码，原样保留缩进、自己横向滚
      if (i % 2) return '<pre>' + esc(p.replace(/^[\w-]*\n/, '').replace(/\n+$/, '')) + '</pre>';
      const out = [];
      let para = [];
      const flush = () => {
        if (para.length) out.push('<p>' + para.join('<br>') + '</p>');
        para = [];
      };
      for (const raw of String(p).split('\n')) {
        const line = raw.replace(/\s+$/, '');
        if (!line.trim()) { flush(); continue; }
        const h = /^#{1,6}\s+(.*)$/.exec(line);
        if (h) { flush(); out.push('<div class="h">' + inline(h[1]) + '</div>'); continue; }
        const li = /^\s*[-*·]\s+(.*)$/.exec(line);
        if (li) { flush(); out.push('<div class="li">' + inline(li[1]) + '</div>'); continue; }
        const no = /^\s*(\d+)[.)]\s+(.*)$/.exec(line);
        if (no) { flush(); out.push('<div class="li n" data-n="' + no[1] + '.">' + inline(no[2]) + '</div>'); continue; }
        para.push(inline(line));
      }
      flush();
      return out.join('');
    }).join('');
  }

  /** 时间线上那一条属于哪一轮：取「开始时间 ≤ 这条」里最近的一轮 */
  function turnFor(turns, at) {
    let best = null;
    for (const t of turns) {
      if (t.at && t.at <= at + 1000 && (!best || t.at > best.at)) best = t;
    }
    return best || turns[0] || null;
  }

  async function toggleFull(btn) {
    const box = $('full-' + btn.dataset.i);
    if (!box) return;
    if (!box.hidden) {
      box.hidden = true;
      btn.textContent = '查看全部 ▾';
      // 看完收起来了：把读的时候欠下的那次刷新补上（进度可能已经长了好几条）
      if (detailDirty && !readingNow()) { detailDirty = false; refreshDetail(); }
      return;
    }
    box.hidden = false;
    btn.textContent = '收起 ▴';
    if (box.dataset.done) return;
    box.innerHTML = '<div class="none">读取中……</div>';
    let r;
    try { r = await loadFull(); } catch (err) { r = { ok: false, why: '读不到：' + err.message }; }
    if (!r || !r.ok) { box.innerHTML = '<div class="none">' + esc((r && r.why) || '读不出来') + '</div>'; return; }
    const t = turnFor(r.turns || [], Number(btn.dataset.at));
    if (!t) { box.innerHTML = '<div class="none">这一段在会话记录里没找着（记录只留最近一截）</div>'; return; }
    const segs = (t.out || []).map((x) => '<div class="seg">' + segHtml(x) + '</div>').join('');
    // 工具排成一个个小块（原来是一长串挤成一坨，手机上没法看）
    const tools = (t.tools || []).length
      ? '<div class="tools"><div class="cap">她动的手 · ' + t.tools.length + ' 次</div>' +
        t.tools.slice(0, 24).map((x) => '<span class="t" title="' + esc(x) + '">' + esc(x) + '</span>').join('') +
        (t.tools.length > 24 ? '<span class="t">…还有 ' + (t.tools.length - 24) + ' 次</span>' : '') + '</div>'
      : '';
    // 顶上一行交代清楚：这一轮多少段、是不是只读到一截 —— 不说的话
    // 用户以为看到的就是全部，其实开头被记录长度掐掉了
    const head = '<div class="none" style="margin-bottom:6px">这一轮 ' + (t.out || []).length + ' 段' +
      (r.truncated ? ' · 更早的部分没读进来（只读最近一截记录）' : '') + '</div>';
    box.innerHTML = head + (t.prompt ? '<div class="seg"><b>你说：</b>' + esc(t.prompt) + '</div>' : '') +
      (segs || '<div class="none">这一轮她没说话，只动了手</div>') + tools;
    box.dataset.done = '1';
  }

  // 详情页每次刷新都是整块重建 innerHTML —— 而 SSE 0.8 秒推一次、轮询 3 秒一次。
  // 你正在输入框里打字，DOM 被换掉 = 输入框连同焦点一起没了，手机上键盘当场收起，
  // 打了一半的字也丢了（用户实拍：「输入的时候自己经常退出输入了，聊不下去」）。
  // 所以：正在打字就**整个跳过这一拍**，记个欠账，等你打完（失焦）再补刷。
  let detailDirty = false;
  // **只认详情页自己那个输入框。**一开始写成「任何输入框有焦点就跳过」，
  // 结果首页的目录框/任务框一被点，详情页就一次都渲染不出来（实测：整页空白）。
  // 这道闸只为「别打断你在详情页打字」而设，管不着别处
  function typingNow() {
    const el = document.activeElement;
    return Boolean(el && el.id === 'd-say');
  }

  // **正在看展开的全文时也别刷。**同一个道理：刷新 = 整块重画，展开的那块
  // 连同你读到哪儿一起没 —— 用户实拍「我都没点收起，碰到边缘就自动收起了，
  // 都没看全」。收起来之后欠的那一刷会自动补上
  function readingNow() {
    return Boolean(document.querySelector('.full:not([hidden])'));
  }

  async function refreshDetail() {
    if (!openId) return;
    // 首次渲染永不跳过 —— 跳了就是一张白纸，比被打断严重得多
    const first = !$('sheet').querySelector('.tl');
    if (!first && (typingNow() || readingNow())) { detailDirty = true; return; }
    let d = null;
    try { d = await fetch(api('/api/detail?id=' + encodeURIComponent(openId))).then((x) => x.json()); } catch (_) { return; }
    if (!d || d.error) { $('sheet').innerHTML = '<div class="empty">这条线不在了</div>'; return; }
    if (!openId) return; // 加载期间用户已经退出去了

    const [cls, word] = STATUS[d.status] || STATUS.idle;
    const crashed = (d.status === 'done' || d.status === 'closed') && d.exitCode !== null && d.exitCode !== 0;

    const tl = (d.timeline || []).map((e, i) => {
      const hm = new Date(e.at).toTimeString().slice(0, 5);
      // 时间线上每条都是截过的（内存里存 300 字）。挂个「查看全部」，
      // 点了去会话档案里把**那一轮的完整输出**捞回来
      // 一眼能看完的就别摆按钮（用户提的）：
      //   你说的话 —— 没被截断就是全的，不用「查看全部」
      //   她说的话 —— 时间线上是**摘要**，全文永远更长，所以留着
      const worth = e.kind === 'her' || (e.kind === 'you' && e.cut);
      const more = worth
        ? '<button class="seeall" data-at="' + e.at + '" data-i="' + i + '">查看全部 ▾</button>' +
          '<div class="full" id="full-' + i + '" hidden></div>'
        : '';
      return '<div class="e ' + e.kind + '"><div class="when"><span class="who">' +
        (KIND[e.kind] || '') + '</span>' + hm + (e.rough ? ' 左右' : '') +
        '</div><div class="txt">' + esc(e.text) + '</div>' + more + '</div>';
    }).join('') || '<div class="empty">还没有进度。她开工后这里会实时长出来</div>';

    const files = (d.files || []).map((f) => '<span class="f">' + esc(f.name) + (f.hits > 1 ? ' ×' + f.hits : '') + '</span>').join('');

    // 等确认时，放行按钮摆在最上面 —— 那是你点进来最想干的事
    const approveBox = d.status === 'waiting'
      ? '<div class="approve"><div class="q">她在等你确认' + (d.waitDetail ? '：' + esc(d.waitDetail) : '这次操作') +
        '</div><div class="btns"><button class="yes" id="d-yes">放行</button><button class="no" id="d-no">拒绝</button></div></div>'
      : '';

    $('sheet').innerHTML =
      '<header><button class="back" id="d-back">← 返回</button></header>' +
      '<div class="card"><div class="t" style="display:flex;align-items:center;gap:7px">' +
      '<span class="led"></span><span class="name">' + esc(d.project || d.name) + '</span>' +
      (d.laneName ? '<span class="lane">' + esc(d.laneName) + '</span>' : '') +
      (money(d.costUsd) ? '<span class="cost">' + money(d.costUsd) + '</span>' : '') + '</div>' +
      '<div class="meta">' + (crashed ? '异常退出（code ' + d.exitCode + '）' : word) + ' · ' + fmtDur(d.elapsedMs) +
      (d.turns ? ' · ' + d.turns + ' 轮' : '') + (d.toolCount ? ' · ' + d.toolCount + ' 次工具' : '') +
      (d.errorCount ? ' · 报错 ' + d.errorCount + ' 次' : '') + '</div>' +
      (files ? '<div class="files">' + files + '</div>' : '') +
      '</div>' + approveBox +
      '<div class="card"><h3>进度</h3><div class="tl">' + tl + '</div></div>' +
      (d.canSend
        ? '<div class="say"><div style="font-size:11px;color:var(--faint);padding:0 2px 6px">说的话会直接打进电脑上那个终端窗口，跟你走过去敲一模一样</div>' +
          '<div class="row"><textarea id="d-say" placeholder="接着说……"></textarea>' +
          '<button id="d-send">发送</button></div><div id="d-msg" style="font-size:12px;min-height:18px;padding:4px 2px"></div></div>'
        : '<div class="empty">这个窗口已经关了，只能看历史</div>');

    $('sheet').querySelector('.term, .card').classList.add(cls); // 灯的颜色跟着状态
    // 输入框：接着上次没打完的字（草稿存在外面，重建也丢不了），
    // 失焦时把欠下的那次刷新补上
    const sayEl = $('d-say');
    if (sayEl) {
      if (sayDraft) sayEl.value = sayDraft;
      sayEl.oninput = () => { sayDraft = sayEl.value; };
      sayEl.onblur = () => { if (detailDirty) { detailDirty = false; refreshDetail(); } };
    }

    // 「查看全部」：sheet 每次刷新都重建 DOM，事件得跟着重挂
    for (const b of document.querySelectorAll('.tl .seeall')) {
      b.onclick = () => toggleFull(b);
    }
    $('d-back').onclick = closeDetail;
    if (d.status === 'waiting') {
      $('d-yes').onclick = () => approve(d.id, true, d.project || d.name);
      $('d-no').onclick = () => approve(d.id, false, d.project || d.name);
    }
    if (d.canSend) {
      $('d-send').onclick = async () => {
        const text = $('d-say').value.trim();
        if (!text) return;
        const dm = $('d-msg');
        dm.textContent = '正在打进电脑上那个终端…'; dm.style.color = 'var(--dim)';
        $('d-send').disabled = true;
        try {
          const r = await fetch(api('/api/send'), {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ id: d.id, text }),
          }).then((x) => x.json());
          if (r.ok) { $('d-say').value = ''; dm.textContent = '说出去了'; dm.style.color = 'var(--acc)'; }
          else { dm.textContent = r.error || '没说出去'; dm.style.color = 'var(--bad)'; }
        } catch (e) { dm.textContent = '网络断了？' + e.message; dm.style.color = 'var(--bad)'; }
        $('d-send').disabled = false;
      };
    }
  }

  // ── 文件夹选择器：翻电脑上的目录（手机上没系统选择器）──────────────
  async function openPicker(start) {
    $('picker').style.display = 'block';
    $('picker').innerHTML = '<div class="empty">加载中…</div>';
    await loadPicker(start || $('dir').value.trim() || '');
  }
  async function loadPicker(dir) {
    let d = null;
    try { d = await fetch(api('/api/browse?dir=' + encodeURIComponent(dir))).then((x) => x.json()); } catch (_) { return; }
    const rows = (d.dirs || []).map((x, i) =>
      '<div class="item" data-i="' + i + '">📁 ' + esc(x.name) +
      (x.project ? '<span class="tag">项目</span>' : '') + '</div>').join('') ||
      '<div class="empty">' + esc(d.error || '这个文件夹里没有子目录') + '</div>';
    $('picker').innerHTML =
      '<div class="cwd">' + (d.cwd ? esc(d.cwd) : '选一个盘') + '</div>' +
      (d.parent !== null && d.cwd ? '<div class="item" id="p-up">⬆ 上一层</div>' : '') +
      rows +
      '<div class="bar"><button id="p-cancel">取消</button>' +
      (d.cwd ? '<button class="use" id="p-use">就用这个文件夹</button>' : '') + '</div>';
    if ($('p-up')) $('p-up').onclick = () => loadPicker(d.parent || '');
    $('picker').querySelectorAll('.item[data-i]').forEach((el) => {
      el.onclick = () => loadPicker(d.dirs[Number(el.dataset.i)].path);
    });
    $('p-cancel').onclick = () => { $('picker').style.display = 'none'; };
    if ($('p-use')) $('p-use').onclick = () => {
      $('dir').value = d.cwd;
      $('picker').style.display = 'none';
    };
  }
  $('pick').onclick = () => openPicker();

  // 长连接：SSE 断了指数退避重连。iOS Safari 把页面冻结后会掐连接，
  // 恢复时**不保证**触发 error —— 光靠 onerror 会一直亮「实时」看旧账。
  // 所以切回前台时主动重连一次，双保险
  let retry = 1000;
  let es = null;
  let reconnTimer = null;
  function scheduleReconnect() {
    if (reconnTimer) return; // 防并发：error 和 visibilitychange 可能同时来
    reconnTimer = setTimeout(() => { reconnTimer = null; connect(); }, retry);
    retry = Math.min(retry * 2, 15000);
  }
  function connect() {
    if (es) { try { es.close(); } catch (_) { /* 已经关了 */ } }
    es = new EventSource(api('/api/events'));
    es.onopen = () => { retry = 1000; lastData = Date.now(); $('net').textContent = '实时'; $('net').className = 'on'; };
    es.onmessage = (e) => {
      lastData = Date.now();
      try { render(JSON.parse(e.data)); } catch (_) { /* 半包丢掉 */ }
      // 详情页开着就一起刷 —— 进度流要跟着实时长
      if (openId) refreshDetail();
    };
    es.onerror = () => {
      try { es.close(); } catch (_) { /* 已经关了 */ }
      $('net').textContent = '重连中…'; $('net').className = 'off';
      scheduleReconnect();
    };
  }
  document.addEventListener('visibilitychange', () => {
    // 回到前台：连接可能已经悄悄死了（error 没触发），主动重连一次
    if (document.visibilityState === 'visible') { retry = 1000; pull(); connect(); }
  });

  // **别把身家性命押在长连接上。** 出门模式要穿过 Cloudflare 的边缘，
  // 那层对 SSE 的缓冲策略不由我们说了算 —— 押上去的后果就是用户看到的
  // 「进去之后任务一个都加载不出来」。所以：进页面先老老实实拉一次，
  // 长连接迟迟没给数据就退回轮询（3 秒一次，也就一个小 JSON）
  let lastData = 0;
  async function pull() {
    try {
      const s = await fetch(api('/api/state'), { cache: 'no-store' }).then((x) => x.json());
      render(s);
      lastData = Date.now();
      if ($('net').className !== 'on') { $('net').textContent = '在线'; $('net').className = 'on'; }
      if (openId) refreshDetail();
    } catch (_) { /* 拉不到就等下一拍 */ }
  }
  pull();
  setInterval(() => {
    // 长连接 8 秒没给过东西 = 它多半被中间层攒住了，自己拉
    if (Date.now() - lastData > 8000) pull();
  }, 3000);

  connect();

  // 安卓返回键：先关详情/选择器，别一下退出整个页面
  history.replaceState({ view: 'home' }, '');
  window.addEventListener('popstate', () => {
    if ($('picker').style.display === 'block') { $('picker').style.display = 'none'; history.pushState({ view: 'home' }, ''); return; }
    if (openId) { closeDetail(); history.pushState({ view: 'home' }, ''); }
  });

  $('go').onclick = async () => {
    const dir = $('dir').value.trim();
    const task = $('task').value.trim();
    const to = $('target').value;

    // 选了现有的线：直接打进那个终端，不开新窗口
    if (to) {
      if (!task) return msg('还没说要说什么', 'err');
      $('go').disabled = true;
      msg('正在打进电脑上那个终端…');
      try {
        const r = await fetch(api('/api/send'), {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ id: to, text: task }),
        }).then((x) => x.json());
        if (r && r.ok) {
          sayDraft = ''; // 发出去了，草稿作废
          msg('说出去了，进度看下面那条线', 'ok');
          $('task').value = '';
        } else msg((r && r.error) || '没说出去', 'err');
      } catch (e) { msg('网络断了？' + e.message, 'err'); }
      $('go').disabled = false;
      return;
    }

    if (!dir) return msg('先选或填项目目录', 'err');
    if (!task) return msg('还没说要干什么活', 'err');
    $('go').disabled = true;
    msg('正在电脑上开工…');
    try {
      const r = await fetch(api('/api/dispatch'), {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          dir, task, agent: $('agent').value,
          permissionMode: $('perm').value || undefined,
          // codex 不认模型参数，选了也不发（发过去只会被 main 丢掉，但别让人误会）
          model: $('agent').value === 'codex' ? '' : $('model').value,
        }),
      }).then((x) => x.json());
      if (r && r.ok !== false) { msg('开工了！进度看下面', 'ok'); $('task').value = ''; }
      else msg((r && r.error) || '没派出去', 'err');
    } catch (e) { msg('网络断了？' + e.message, 'err'); }
    $('go').disabled = false;
  };
</script>
</body>
</html>
